name: CI

# Pull requests and feature branches. `main` is built (and released) by release.yml.
on:
  pull_request:
  push:
    branches-ignore: [main]
    tags-ignore: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install font subsetter
        run: pip install --quiet fonttools brotli
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          ORYVEX_UPDATE_REPO: ${{ github.repository }}
      - name: Verify bundle
        run: node scripts/verify-build.mjs
      - name: Docs site builds
        run: node scripts/build-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: oryvex-worker-panel-${{ github.sha }}
          path: |
            worker-single-file.js
            oryvex-worker-panel-pages.zip
            panel-preview.html
          if-no-files-found: error
