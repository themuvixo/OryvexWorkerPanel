name: Auto

# Automatically run the shared CI checks for every branch push and pull request.
# Release and GitHub Pages deployments keep their own event triggers.
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    uses: ./.github/workflows/ci.yml
